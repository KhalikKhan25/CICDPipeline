name: Model Training CICD

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-report:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check input files
        shell: bash
        run: |
          set -euo pipefail

          python --version
          ls -lah

          for file in requirements.txt train_model.py iris.csv; do
            if [ ! -f "$file" ]; then
              echo "::error::Required input file missing: $file"
              exit 1
            fi
          done

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Train model
        run: python train_model.py

      - name: Verify generated outputs
        shell: bash
        run: |
          set -euo pipefail

          ls -lah

          for file in scores.txt ConfusionMatrix.png FeatureImportance.png; do
            if [ ! -s "$file" ]; then
              echo "::error::Missing or empty output: $file. Check train_model.py output paths."
              exit 1
            fi
          done

      - name: Create report
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Model Training Report"
            echo
            echo "### RF and LR Model Scores"
            echo '```text'
            cat scores.txt
            printf '\n'
            echo '```'
            echo
            echo "Confusion matrix and feature importance images are available"
            echo "in the model-training-results artifact on this workflow run."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > report.md

          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload training results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-training-results
          if-no-files-found: warn
          retention-days: 7
          path: |
            scores.txt
            ConfusionMatrix.png
            FeatureImportance.png
            report.md

      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Publish scores as a commit comment
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cml comment create --publish=false report.md
